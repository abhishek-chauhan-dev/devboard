global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8080']    
    metrics_path: /metrics  

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']    
