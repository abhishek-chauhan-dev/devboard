namespace: devboard

replicas: 1

deployment:
  postgres:
    name: postgres
    image: postgres:16-alpine
    port: 5432
    environment:
      POSTGRES_DB: devboard
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    failureThreshold: 30
    periodSeconds: 10  
    initialDelaySeconds: 15
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"   

  backend:
    name: backend
    image: abhishekchauhandev/devboard-backend:v1.4
    port: 8080
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 3
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"      

  frontend:
    name: frontend
    image: abhishekchauhandev/devboard-frontend:v1.4
    port: 4173
    resources:
      requests:
        memory: "200Mi"
        cpu: "200m"
      limits:
        memory: "400Mi"
        cpu: "300m"   

  nginx:
    name: nginx
    image: nginx:1.30.4
    port: 80
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"             

service:
  postgres:
    protocol: TCP
    port: 5432
    targetPort: 5432

  backend:
    protocol: TCP
    port: 8081
    targetPort: 8080

  frontend:
    protocol: TCP
    port: 4173
    targetPort: 4173  

  nginx:
    protocol: TCP
    port: 8082
    targetPort: 80  

PersistentVolumeClaim:
  name: devboard-pvc
  storage: 2Gi
  accessModes: ReadWriteOnce
  storageClassName: standard    

PodDisruptionBudget:
  frontend:
    minAvailable: 3
  backend:
    maxUnavailable: 20%  