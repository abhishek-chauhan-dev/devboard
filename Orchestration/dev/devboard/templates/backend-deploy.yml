apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.backend.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.deployment.backend.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.backend.name }}
    spec:
      containers:
      - name: {{ .Values.deployment.backend.name }}
        image: {{ .Values.deployment.backend.image }}
        resources:
          requests:
            memory: {{ .Values.deployment.backend.resources.requests.memory }}
            cpu: {{ .Values.deployment.backend.resources.requests.cpu }}
          limits:
            memory: {{ .Values.deployment.backend.resources.limits.memory }}
            cpu: {{ .Values.deployment.backend.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.deployment.backend.path }}
            port: {{ .Values.deployment.backend.port }}
          initialDelaySeconds: {{ .Values.deployment.backend.initialDelaySeconds }}
          periodSeconds: {{ .Values.deployment.backend.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.deployment.backend.path }}
            port: {{ .Values.deployment.backend.port }}
          initialDelaySeconds: {{ .Values.deployment.backend.initialDelaySeconds }}
          periodSeconds: {{ .Values.deployment.backend.periodSeconds }}
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: POSTGRES_USER
        - name: POSTGRES_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
        ports:
        - containerPort: {{ .Values.deployment.backend.port }}