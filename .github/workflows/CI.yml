# Goal - In this workflow, we will implement Continuous Integration (CI) of frontend + backend.
# Steps:
# 1. Checkout the code from the repository.
# 2. Setup Node.js/go environment.
# 3. Install dependencies.
# 4. Lint the code.
# 5. Run tests.
# 6. Build the code.

name: Continuous Integration

on:
  push:
    branches:
      - day1

jobs:

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: true
          cache-dependency-path: './frontend'

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Lint code
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm run test    

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: abhishekchauhandev/devboard-frontend:${{ github.sha }}

  backend:  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          go-version-file: './backend/go.mod'
          cache-dependency-path: './backend/go.sum'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          cd backend
          go get .   

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13