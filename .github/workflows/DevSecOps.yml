# Goal - In this workflow, we will implement DevSecOps as part of Continuous Integration.

name: DevSecOps

on:
  push:
    branches:
      - day1

permissions:
  contents: write

jobs:

  code-lint:
    uses: ./.github/workflows/code-lint.yml

  code-test:
    uses: ./.github/workflows/code-test.yml
    needs:
      - code-lint

  dependency-check:
    uses: ./.github/workflows/dependency-check.yml  
    needs:
      - code-lint
      - code-test

  secret-scan:
    uses: ./.github/workflows/secret-leaks.yml
    needs:
      - code-lint
      - code-test
      - dependency-check
  
  dockerfile-lint:
    uses: ./.github/workflows/Dockerfile-lint.yml
    needs:
      - code-lint
      - code-test
      - dependency-check
      - secret-scan

  build-and-scan:
    uses: ./.github/workflows/docker-build-scan.yml
    secrets: inherit
    needs:
      - code-lint
      - code-test
      - dependency-check
      - secret-scan
      - dockerfile-lint

