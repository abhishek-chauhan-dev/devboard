# Goal: To ensure that the image and scan image.

name: docker build and scan

on:
  workflow_call:

jobs:
  build-and-scan:
    strategy:
      matrix:
        project: ['frontend', 'backend']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: false
          load: true
          tags: abhishekchauhandev/devboard-${{ matrix.project }}:${{ github.sha }}
      
      - name: Scan for vulnerabilities
        uses: crazy-max/ghaction-container-scan@v4
        with:
          image: abhishekchauhandev/devboard-${{ matrix.project }}:${{ github.sha }}
          dockerfile: ./${{ matrix.project }}

      - name: Build and push image to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: true
          tags: abhishekchauhandev/devboard-${{ matrix.project }}:${{ github.sha }}

  update-image:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7    
      - name: Update image in git repo
        run: |
          cd Orchestration/dev
          git config --global user.name "github-actions-bot"
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          sed -i "s|abhishekchauhandev/devboard-backend:.*|abhishekchauhandev/devboard-backend:${{ github.sha}}|" backend-deploy.yml
          sed -i "s|abhishekchauhandev/devboard-frontend:.*|abhishekchauhandev/devboard-frontend:${{ github.sha }}|" frontend-deploy.yml
          git add backend-deploy.yml frontend-deploy.yml
          git commit -m "Image tag updated to ${{ github.sha }} for backend and frontend"
          git push origin day1