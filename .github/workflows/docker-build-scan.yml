# Goal: To ensure that the image and scan image.

name: docker build and scan

on:
  workflow_call:

jobs:
  build-and-scan:
    strategy:
      matrix:
        project: ['frontend', 'backend']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: true
          tags: abhishekchauhandev/devboard-${{ matrix.project }}:${{ github.sha }}
      
      - name: Scan for vulnerabilities
        uses: crazy-max/ghaction-container-scan@v4
        with:
          image: abhishekchauhandev/devboard-${{ matrix.project }}:${{ github.sha }}
          dockerfile: ./${{ matrix.project }}