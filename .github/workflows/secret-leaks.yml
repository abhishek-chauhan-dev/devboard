# Goal: In this workflow, we need to ensure that no secrets are exposed in code.

name: Secret scan

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3