#Goal - In this workflow, I will ensure that the code syntax is correct.

name: Code Quality

on:
  workflow_call:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git creds check
        uses: gitleaks/gitleaks-action@v3