# Goal: Code build, lint, test, and push image to DockerHub.

name: Continuous Integration

on:
  push:
    branches:
      - advanced

env:
  FRONTEND_IMAGE_TAG: abhishekchauhandev/frontend:v1.3

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: code clone
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: install dependencies
        run: npm install

      - name: code build
        run: npm run build

      - name: code lint
        run: npm run lint

      - name: code test
        run: npm run test

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.FRONTEND_IMAGE_TAG }}