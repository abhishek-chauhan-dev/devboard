# Goal: Code build, lint, test, and push image to DockerHub.

name: Continuous Integration

on:
  push:
    branches:
      - advanced

env:
  FRONTEND_IMAGE_TAG: abhishekchauhandev/devboard-frontend:v1.3
  BACKEND_IMAGE_TAG: abhishekchauhandev/devboard-backend:v1.3

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: code clone
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: install dependencies
        run: npm install

      - name: code build
        run: npm run build

      - name: code lint
        run: npm run lint

      - name: code test
        run: npm run test

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE_TAG }}

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: code clone
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ./backend/go.sum

      - name: install dependencies
        run: go mod download

      - name: code build
        run: go build

      - name: code test
        run: go test

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE_TAG }}

  deploy:
    needs: 
      - frontend
      - backend
    runs-on: self-hosted
    steps:
      - name: code clone
        uses: actions/checkout@v7

      - name: copy .env.example as .env
        run: cp .env.example .env

      - name: docker login  
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

      - name: deploy using docker-compose
        run: |
          docker compose pull
          docker compose up -d