namespace: devboard

module:
  backend:
    replicas: 1
    name: backend
    image: abhishekchauhandev/devboard-backend:82ffc15db85de361db4eae96a9d844fad7e56216
    ports:
      containerPort: 8080
      protocol: TCP
      port: 8081
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"
  
  frontend:
    replicas: 1
    name: frontend
    image: abhishekchauhandev/devboard-frontend:82ffc15db85de361db4eae96a9d844fad7e56216
    ports:
      containerPort: 4173
      protocol: TCP
      port: 8080
    resources:
      requests:
        memory: "200Mi"
        cpu: "200m"
      limits:
        memory: "400Mi"
        cpu: "300m"
  
  nginx:
    replicas: 1
    name: nginx
    image: nginx:1.30.4
    command: ["/docker-entrypoint.sh"]
    ports:
      containerPort: 80
      protocol: TCP
      port: 8082
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"

  postgres:
    replicas: 1
    name: postgres
    image: postgres:16-alpine
    ports:
      containerPort: 5432
      protocol: TCP
      port: 5432
    securityContext:
      allowPrivilegeEscalation: true
      appArmorProfile:
        type: Unconfined  
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"
        cpu: "100m"

secret:
  name: db-creds
  POSTGRES_DB: ZGV2Ym9hcmQ=
  POSTGRES_PASSWORD: ZGV2Ym9hcmQ=
  POSTGRES_USER: ZGV2Ym9hcmQ=

persistentVolumeClaim:
  name: devboard-pvc
  accessModes: ReadWriteOnce
  storageClassName: local-path #local-path for K3s cluster
  resources:
    requests:
      storage: 2Gi