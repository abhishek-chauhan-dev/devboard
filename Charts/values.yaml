namespace: devboard

secret:
  name: db-creds
  POSTGRES_DB: ZGV2Ym9hcmQ=
  POSTGRES_PASSWORD: ZGV2Ym9hcmQ=
  POSTGRES_USER: ZGV2Ym9hcmQ=

persistentVolumeClaim:
  name: devboard-pvc
  accessModes: ReadWriteOnce
  storageClassName: standard
  storage: 2Gi

module:
  postgres:
    name: postgres
    image: postgres:16-alpine
    port: 5432
    targetPort: 5432
    protocol: TCP
    replicas: 1
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
    readinessProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      periodSeconds: 10
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"
  
  backend:
    name: backend
    image: abhishekchauhandev/devboard-backend:82ffc15db85de361db4eae96a9d844fad7e56216
    port: 8081
    targetPort: 8080
    protocol: TCP
    replicas: 1
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"
    livenessProbe:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 3
    readinessProbe:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 3

  frontend:
    name: frontend
    image: abhishekchauhandev/devboard-frontend:82ffc15db85de361db4eae96a9d844fad7e56216
    replicas: 1
    protocol: TCP
    port: 8080
    targetPort: 4173
    resources:
      requests:
        memory: "200Mi"
        cpu: "200m"
      limits:
        memory: "400Mi"
        cpu: "300m"
  
  nginx:
    name: nginx
    image: nginx:1.30.4
    protocol: TCP
    port: 8082
    targetPort: 80
    replicas: 1
    mountPath: "/etc/nginx/conf.d/default.conf"
    subPath: nginx.conf
    readOnly: true
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"