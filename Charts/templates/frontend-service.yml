apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.module.frontend.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.module.frontend.name }}
  ports:
    - protocol: {{ .Values.module.frontend.protocol }}
      port: {{ .Values.module.frontend.port }}
      targetPort: {{ .Values.module.frontend.targetPort }}