apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.module.postgres.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.module.postgres.name }}
spec:
  replicas: {{ .Values.module.postgres.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.module.postgres.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.module.postgres.name }}
    spec:
      # Make sure to add the matching label on the node defined below.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - us-west-2
      containers:
      - name: {{ .Values.module.postgres.name }}
        image: {{ .Values.module.postgres.image }}
        securityContext:
          allowPrivilegeEscalation: {{ .Values.module.postgres.securityContext.allowPrivilegeEscalation }}
          appArmorProfile:
            type: {{ .Values.module.postgres.securityContext.appArmorProfile.type }}
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: POSTGRES_USER
        resources:
          requests:
            memory: {{ .Values.module.postgres.resources.requests.memory | quote }}
            cpu: {{ .Values.module.postgres.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.module.postgres.resources.limits.memory | quote }}
            cpu: {{ .Values.module.postgres.resources.limits.cpu | quote }}
        ports:
        - containerPort: {{ .Values.module.postgres.ports.containerPort }}
        volumeMounts:
        - name: db-scripts
          mountPath: "/docker-entrypoint-initdb.d"
          readOnly: true
        - mountPath: "/var/lib/postgresql/data"
          name: data  
      volumes:
      - name: db-scripts
        configMap:
          name: db-scripts
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.persistentVolumeClaim.name }}