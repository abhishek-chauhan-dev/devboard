apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.module.postgres.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.module.postgres.name }}
  ports:
    - protocol: {{ .Values.module.postgres.protocol }}
      port: {{ .Values.module.postgres.port }}
      targetPort: {{ .Values.module.postgres.targetPort }}