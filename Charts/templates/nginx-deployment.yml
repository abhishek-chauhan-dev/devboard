apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.module.nginx.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.module.nginx.name }}
spec:
  replicas: {{ .Values.module.nginx.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.module.nginx.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.module.nginx.name }}
    spec:
      containers:
      - name: {{ .Values.module.nginx.name }}
        image: {{ .Values.module.nginx.image }}
        resources:
          requests:
            memory: {{ .Values.module.nginx.resources.requests.memory | quote}}
            cpu: {{ .Values.module.nginx.resources.requests.cpu | quote}}
          limits:
            memory: {{ .Values.module.nginx.resources.limits.memory | quote}}
            cpu: {{ .Values.module.nginx.resources.limits.cpu | quote}}
        command: {{ .Values.module.nginx.command }}  
        args:
        - {{ .Values.module.nginx.name }}
        - -g
        - "daemon off;"
        ports:
        - containerPort: {{ .Values.module.nginx.ports.containerPort }}
        volumeMounts:
        - name: {{ .Values.module.nginx.name }}-config
          mountPath: "/etc/nginx/conf.d/default.conf"
          subPath: nginx.conf
          readOnly: true
      volumes:
      - name: {{ .Values.module.nginx.name }}-config
        configMap:
          name: {{ .Values.module.nginx.name }}