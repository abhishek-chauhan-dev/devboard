apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devboard-cluster
  region: us-west-2
  version: "1.35"
  tags:
    project: devboard

nodeGroups:
  - name: devboard-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    labels:
      role: worker

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

addons:
  - name: aws-ebs-csi-driver
    version: latest